name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Default GITHUB_TOKEN scope (avoids 403 on post-job git cleanup)
permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # npm registry — avoids SamKirkland/FTP-Deploy-Action codeload download failures on GitHub
      - name: Upload dist/ to cPanel (FTPS)
        run: |
          npm install --no-save ftp-deploy@2.4.3
          node scripts/deploy-cpanel.cjs
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
