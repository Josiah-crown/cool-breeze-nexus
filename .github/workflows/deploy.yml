# Push to main → npm build → FTPS upload to cPanel public_html
# Single job (no artifacts / no extra actions) — most reliable when codeload is flaky.

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

# Match repo Settings → Actions → "Read and write permissions" for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
          # Optional: add repo secret GH_REPO_TOKEN (classic PAT, repo scope) if checkout 403 persists
          token: ${{ secrets.GH_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify dist
        run: test -f dist/index.html && du -sh dist/

      - name: Deploy dist to cPanel (FTPS)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          for attempt in 1 2 3; do
            echo "=== FTP upload attempt ${attempt} ==="
            if lftp -e "
              set net:max-retries 3;
              set net:timeout 60;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              open -u \"\$CPANEL_USER\",\"\$CPANEL_PASS\" ftps://\$CPANEL_HOST:21;
              mirror -Rev dist/ /public_html/ --parallel=2 --verbose;
              bye
            "; then
              echo "FTP deploy succeeded"
              exit 0
            fi
            echo "FTP attempt ${attempt} failed; retrying in 20s..."
            sleep 20
          done
          echo "FTP deploy failed after 3 attempts"
          exit 1
