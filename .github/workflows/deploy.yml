# Build + FTPS deploy without actions/checkout or other codeload downloads.
# Fixes recurring 403 / packfile / download-artifact failures on this repo.

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
      CPANEL_REMOTE_ROOT: ${{ secrets.CPANEL_REMOTE_ROOT }}

    steps:
      - name: Fetch source (GitHub API tarball, no git)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" \
            -o /tmp/repo.tar.gz
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
          test -f package.json
          echo "Source tree ready at $GITHUB_WORKSPACE"

      - name: Setup Node 20
        run: |
          set -euo pipefail
          if node -v 2>/dev/null | grep -qE '^v20\.'; then
            echo "Using runner Node $(node -v)"
          else
            echo "Installing Node 20 from nodejs.org"
            curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz -o /tmp/node.tar.xz
            sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          fi
          node -v
          npm -v

      - name: Install and build
        run: npm ci && npm run build

      - name: Verify dist
        run: test -f dist/index.html && du -sh dist/

      - name: Deploy dist to cPanel (FTPS via npm ftp-deploy)
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_HOST:-}" ] || [ -z "${CPANEL_USER:-}" ] || [ -z "${CPANEL_PASS:-}" ]; then
            echo "Missing CPANEL_HOST, CPANEL_USER, or CPANEL_PASS in repo secrets"
            exit 1
          fi
          REMOTE="${CPANEL_REMOTE_ROOT:-/public_html/}"
          case "$REMOTE" in
            */) ;;
            *) REMOTE="${REMOTE}/" ;;
          esac
          export CPANEL_REMOTE_ROOT="$REMOTE"
          echo "Deploying dist/ to ${CPANEL_HOST}:${REMOTE}"
          npm install --no-save ftp-deploy@2.4.3
          node scripts/deploy-cpanel.cjs
