name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # curl + API — avoids codeload failures downloading actions/download-artifact
      - name: Download dist artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
          artifact_id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name=="dist") | .id' | head -1)
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "No dist artifact found for this run"
            exit 1
          fi
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" \
            -o artifact.zip
          unzip -q artifact.zip
          test -d dist || (echo "dist/ missing after unzip" && exit 1)
          ls -la dist/ | head

      - name: Upload dist/ to cPanel (FTPS via lftp)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -e "
            set net:max-retries 3;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u \"\$CPANEL_USER\",\"\$CPANEL_PASS\" ftps://\$CPANEL_HOST:21;
            mirror -Rev dist/ /public_html/ --parallel=2 --verbose;
            bye
          "
